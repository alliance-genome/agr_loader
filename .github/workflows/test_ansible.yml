name: Test SSH Connection to Gateway Server

on:
  push:
    branches:
      - fb_ansible_test

jobs:
  ssh-connection-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up SSH agent and add keys
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Test SSH connection to gateway server
      run: |
        ssh -v -o StrictHostKeyChecking=no ${{ secrets.GATEWAY_USER }}@${{ secrets.GATEWAY_HOST }} "echo Connected to gateway server"
